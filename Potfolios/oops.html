<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #eef2f5;
        }

        .badge {
            display: inline-block;
            background-color: #e8f0fe;
            color: #0066cc;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        p {
            font-size: 1.05rem;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        /* Blue primary accent */
        .btn-primary {
            background-color: #0066cc;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #0052a3;
        }

        /* Green contact accent */
        .btn-success {
            background-color: #28a745;
            color: #ffffff;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        /* Gray subtle back/secondary button */
        .btn-secondary {
            background-color: #f1f3f5;
            color: #495057;
        }

        .btn-secondary:hover {
            background-color: #e9ecef;
            color: #212529;
        }

        /* Responsive layout for desktop screens */
        @media (min-width: 576px) {
            .btn-group {
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
            }
            .btn {
                flex: 1 1 calc(50% - 6px);
            }
            .btn-primary {
                flex: 1 1 100%; /* Make main action full width on desktop if desired */
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <span class="badge">Work in Progress</span>
        <h1>Oops! Demo Only</h1>
        <p>
            This feature or project page isn't fully designed or built yet! It's currently just a placeholder demo for observation purposes. 
            <br><br>
            Feel free to look around, and if you have feedback or want to see more, please reach out!
        </p>

        <div class="btn-group">
            <a href="index.html#contact" class="btn btn-success">Get in Touch</a>
            <a href="index.html" class="btn btn-primary">Go to Homepage</a>
            <button onclick="history.back()" class="btn btn-secondary">Go Back</button>
        </div>
    </main>

</body>
</html>
